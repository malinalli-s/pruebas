<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reproductor de audio</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #152720;
      color: #ffffff;
      font-family: Arial, sans-serif;
    }

    .player {
      width: min(360px, 85vw);
      padding: 24px;
      border-radius: 20px;
      background: #243d32;
      text-align: center;
    }

    h1 {
      margin: 0 0 20px;
      font-size: 24px;
    }

    audio {
      display: block;
      width: 100%;
    }

    video {
  display: block;
  width: 100%;
  border-radius: 12px;
  background: #000;
}

h2 {
  margin-top: 28px;
  font-size: 20px;
}
  </style>
</head>

<body>
  <main class="player">
    <h1>Sonido del bosque</h1>

    <audio controls preload="metadata">
      <source
        src="audio.wav"
        type="audio/wav"
      >
      Tu navegador no admite la reproducción de audio.
    </audio>


    <h2>Video del unicornio</h2>

<video controls preload="metadata" playsinline>
  <source
    src="videounicornio.mp4"
    type="video/mp4"
  >
  Tu navegador no admite la reproducción de video.
</video>
  </main>

  
</body>
</html>
